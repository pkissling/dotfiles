name: Nix
on:
  push:
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - .github/workflows/nix.yml

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Build systems
        run: nix build .#darwinConfigurations.private.system .#darwinConfigurations.work.system
