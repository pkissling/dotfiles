---
name: Lint
on: push

permissions:
  contents: read

jobs:
  linter:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # mods' tsconfig extends a gitignored, harness-generated file
      - name: Stub mod type configs
        run: |
          for d in claude/mods/*/.claude-plugin; do
            mkdir -p "$d/types" && echo '{}' > "$d/types/tsconfig.json"
          done
      - name: Lint Code Base
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # vscode json settings comments break linting
          VALIDATE_JSON: false
          # formatters only; the repo is not prettier/shfmt formatted
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_JSON_PRETTIER: false
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_YAML_PRETTIER: false
          VALIDATE_SHELL_SHFMT: false
          # complains about "git" and "zsh" not being capitalized
          VALIDATE_NATURAL_LANGUAGE: false
          VALIDATE_SPELL_CODESPELL: false
          # eslint can't resolve the harness's "claude-code" module; biome covers TS
          VALIDATE_TYPESCRIPT_ES: false
