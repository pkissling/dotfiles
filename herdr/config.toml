onboarding = false
[theme]
name = "nord"

[theme.custom]
subtext0 = "#a5afc0"
overlay1 = "#a5afc0"

[ui]
window_title = "herdr {hostname}"
tab_bar_right = [
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "
agent_panel_sort = "priority"
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
prompt_new_workspace_name = true
[ui.toast]
delivery = "terminal"

[keys]
split_vertical = 'prefix+%'
split_horizontal = 'prefix+"'
new_worktree = 'prefix+alt+g'

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "~/dotfiles/herdr/agent-layout"

[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "~/dotfiles/herdr/new-worktree"
description = "new worktree (from parent repo in a worktree)"
height = 8

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace", "tab"],
  [{ token = "terminal_title_stripped", fg = "#c0c8d6", dim = false }],
  [{ token = "agent", fg = "#a5afc0", dim = false }],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  [{ token = "branch", fg = "#a5afc0", dim = false }, { token = "git_status", dim = false }],
]
