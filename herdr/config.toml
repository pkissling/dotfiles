onboarding = false
[theme]
name = "nord"

[theme.custom]
subtext0 = "#a5afc0"
overlay1 = "#a5afc0"

[ui]
tab_bar_right = [
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "
[ui.toast]
delivery = "terminal"

[keys]
split_vertical = 'prefix+%'
split_horizontal = 'prefix+"'

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = "~/dotfiles/herdr/agent-layout"

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace", "tab"],
  [{ token = "terminal_title_stripped", fg = "#c0c8d6", dim = false }],
  [{ token = "agent", fg = "#a5afc0", dim = false }],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  [{ token = "branch", fg = "#a5afc0", dim = false }, { token = "git_status", dim = false }],
]
