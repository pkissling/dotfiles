onboarding = false
[theme]
name = "nord"

[theme.custom]
subtext0 = "#a5afc0"
overlay1 = "#a5afc0"

[ui]
window_title = "herdr {hostname}"
tab_bar_right = [
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "
agent_panel_sort = "priority"
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "terminal"

[keys]
split_vertical = 'prefix+%'
split_horizontal = 'prefix+"'
new_worktree = ""
close_workspace = ""

[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "~/dotfiles/herdr/worktree-action new"
description = "new worktree (from parent if in a worktree)"
height = 8

[[keys.command]]
key = "prefix+shift+d"
type = "popup"
command = "~/dotfiles/herdr/worktree-action discard"
description = "close workspace / discard worktree"
height = "50%"

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "~/dotfiles/herdr/agent-layout"

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace", "tab"],
  [{ token = "terminal_title_stripped", fg = "#c0c8d6", dim = false }],
  [{ token = "agent", fg = "#a5afc0", dim = false }],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  [{ token = "branch", fg = "#a5afc0", dim = false }, { token = "git_status", dim = false }],
]
