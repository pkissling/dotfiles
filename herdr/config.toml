[theme]
name = "nord"

[theme.custom]
subtext0 = "#a5afc0"
overlay1 = "#a5afc0"

[ui]
tab_bar_right = [
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "
[ui.toast]
delivery = "terminal"

[keys]
split_vertical = 'prefix+%'
split_horizontal = 'prefix+"'

[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = "~/dotfiles/herdr/agent-layout"
